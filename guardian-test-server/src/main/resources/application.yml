server:
  port: 8080

spring:
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info,metrics"
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true # Gives us P95/P99 latency buckets
    tags:
      application: guardian-server

guardian:
  token-bucket:
    plans:
      load_test_plan:
        default:
          bucketCapacity: 100
          refillRate: 50
    failure-mode: closed

  sliding-window:
    failure-mode: closed
    plans:
      strict_plan:
        default:
          requestLimit: 5          # Only 5 requests
          windowSizeInSeconds: 60  # Per 1 minute