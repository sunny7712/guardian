global:
  # pretty aggressive, but it's needed since we are running loadtests
  scrape_interval: 2s

scrape_configs:
  - job_name: 'guardian-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['guardian-app:8080']
  - job_name: 'cadvisor'
    static_configs:
      - targets: [ 'cadvisor:8080']
